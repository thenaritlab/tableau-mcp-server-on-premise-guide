<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#7b8494"/></marker></defs>
<!-- user zone -->
<rect x="10" y="20" width="260" height="290" rx="10" fill="#fff" stroke="#dfe4ec" stroke-dasharray="5 4"/>
<text x="140" y="44" text-anchor="middle" font-weight="600" fill="#4a5566">User workstation / SaaS AI</text>
<rect x="30" y="62" width="220" height="56" rx="8" fill="#f6f8fb" stroke="#c9d1dc"/>
<text x="140" y="85" text-anchor="middle" font-weight="600" fill="#1c2430">MCP host (AI client)</text>
<text x="140" y="104" text-anchor="middle" fill="#4a5566">Claude · ChatGPT · Gemini · Copilot</text>
<rect x="30" y="136" width="220" height="56" rx="8" fill="#f6f8fb" stroke="#c9d1dc"/>
<text x="140" y="159" text-anchor="middle" font-weight="600" fill="#1c2430">LLM</text>
<text x="140" y="178" text-anchor="middle" fill="#4a5566">decides which tool to call</text>
<line x1="140" y1="118" x2="140" y2="136" stroke="#7b8494" stroke-width="1.5" marker-end="url(#a1)" marker-start="url(#a1)"/>
<rect x="30" y="220" width="220" height="70" rx="8" fill="#fff" stroke="#c9d1dc"/>
<text x="140" y="245" text-anchor="middle" font-weight="600" fill="#1c2430">Transport</text>
<text x="140" y="264" text-anchor="middle" fill="#4a5566">stdio (local process) or</text>
<text x="140" y="281" text-anchor="middle" fill="#4a5566">Streamable HTTP (shared server)</text>
<!-- mcp zone -->
<rect x="300" y="20" width="280" height="290" rx="10" fill="#e8f0f9" stroke="#1c5d99" stroke-width="1.5"/>
<text x="440" y="44" text-anchor="middle" font-weight="600" fill="#0f3d6b">Tableau MCP server (Node.js)</text>
<g fill="#4a5566">
<rect x="320" y="62" width="240" height="40" rx="8" fill="#fff" stroke="#c9d1dc"/><text x="440" y="87" text-anchor="middle">Tool registry (list / query / search…)</text>
<rect x="320" y="112" width="240" height="40" rx="8" fill="#fff" stroke="#c9d1dc"/><text x="440" y="137" text-anchor="middle">Auth: PAT · Direct Trust · OAuth</text>
<rect x="320" y="162" width="240" height="40" rx="8" fill="#fff" stroke="#c9d1dc"/><text x="440" y="187" text-anchor="middle">Tool scoping · include / exclude</text>
<rect x="320" y="212" width="240" height="40" rx="8" fill="#fff" stroke="#c9d1dc"/><text x="440" y="237" text-anchor="middle">Logging · telemetry plugins</text>
<rect x="320" y="262" width="240" height="36" rx="8" fill="#fff" stroke="#c9d1dc"/><text x="440" y="285" text-anchor="middle">Embedded OAuth authorization server</text>
</g>
<!-- tableau zone -->
<rect x="610" y="20" width="280" height="290" rx="10" fill="#fff" stroke="#dfe4ec"/>
<text x="750" y="44" text-anchor="middle" font-weight="600" fill="#4a5566">Tableau Server (on-premise)</text>
<g fill="#4a5566">
<rect x="630" y="62" width="240" height="40" rx="8" fill="#f6f8fb" stroke="#c9d1dc"/><text x="750" y="87" text-anchor="middle">Gateway (80 / 443)</text>
<rect x="630" y="112" width="240" height="40" rx="8" fill="#f6f8fb" stroke="#c9d1dc"/><text x="750" y="137" text-anchor="middle">REST API · Metadata API</text>
<rect x="630" y="162" width="240" height="40" rx="8" fill="#f6f8fb" stroke="#c9d1dc"/><text x="750" y="187" text-anchor="middle">VizQL Data Service (queries)</text>
<rect x="630" y="212" width="240" height="40" rx="8" fill="#f6f8fb" stroke="#c9d1dc"/><text x="750" y="237" text-anchor="middle">Published data sources · RLS</text>
<rect x="630" y="262" width="240" height="36" rx="8" fill="#f6f8fb" stroke="#c9d1dc"/><text x="750" y="285" text-anchor="middle">Databases (SQL Server, Oracle…)</text>
</g>
<line x1="272" y1="165" x2="298" y2="165" stroke="#7b8494" stroke-width="2" marker-end="url(#a1)" marker-start="url(#a1)"/>
<line x1="582" y1="165" x2="608" y2="165" stroke="#7b8494" stroke-width="2" marker-end="url(#a1)" marker-start="url(#a1)"/>
</svg>