<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">
<defs><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#7b8494"/></marker></defs>
<text x="20" y="28" font-weight="700" font-size="14" fill="#1f2937">An AI request must pass every layer — the first "no" wins</text>
<g>
<rect x="20" y="48" width="160" height="290" rx="10" fill="#e9f1fb" stroke="#2563a8" stroke-width="1.5"/>
<text x="100" y="74" text-anchor="middle" font-weight="700" fill="#17457a">1 · Licence</text>
<text x="100" y="94" text-anchor="middle" fill="#4b5563" font-size="12">Site role</text>
<g fill="#1f2937" font-size="12"><text x="100" y="124" text-anchor="middle">Creator</text><text x="100" y="146" text-anchor="middle">Explorer (can publish)</text><text x="100" y="168" text-anchor="middle">Explorer</text><text x="100" y="190" text-anchor="middle">Viewer</text><text x="100" y="212" text-anchor="middle" fill="#b83a3a">Unlicensed = nothing</text></g>
<text x="100" y="258" text-anchor="middle" fill="#6b7280" font-size="11">ceiling of what a user</text><text x="100" y="274" text-anchor="middle" fill="#6b7280" font-size="11">can ever be allowed</text>
</g>
<line x1="182" y1="190" x2="198" y2="190" stroke="#7b8494" stroke-width="2" marker-end="url(#ap)"/>
<g>
<rect x="200" y="48" width="160" height="290" rx="10" fill="#f4f6fa" stroke="#cfd6e0"/>
<text x="280" y="74" text-anchor="middle" font-weight="700" fill="#1f2937">2 · Project</text>
<text x="280" y="94" text-anchor="middle" fill="#4b5563" font-size="12">Folder hierarchy</text>
<g fill="#1f2937" font-size="12"><text x="280" y="124" text-anchor="middle">View project</text><text x="280" y="146" text-anchor="middle">Publish / Save</text><text x="280" y="168" text-anchor="middle">Project leader</text><text x="280" y="190" text-anchor="middle">🔒 Locked permissions</text></g>
<text x="280" y="258" text-anchor="middle" fill="#6b7280" font-size="11">the AI only sees</text><text x="280" y="274" text-anchor="middle" fill="#6b7280" font-size="11">projects the user can view</text>
</g>
<line x1="362" y1="190" x2="378" y2="190" stroke="#7b8494" stroke-width="2" marker-end="url(#ap)"/>
<g>
<rect x="380" y="48" width="160" height="290" rx="10" fill="#f4f6fa" stroke="#cfd6e0"/>
<text x="460" y="74" text-anchor="middle" font-weight="700" fill="#1f2937">3 · Content</text>
<text x="460" y="94" text-anchor="middle" fill="#4b5563" font-size="12">Capabilities</text>
<g fill="#1f2937" font-size="12"><text x="460" y="124" text-anchor="middle">Workbook: View, Filter,</text><text x="460" y="141" text-anchor="middle">Download Summary / Full</text><text x="460" y="158" text-anchor="middle">Data, Web Edit …</text><text x="460" y="184" text-anchor="middle">Data source: View,</text><text x="460" y="201" text-anchor="middle">Connect, Download …</text></g>
<text x="460" y="258" text-anchor="middle" fill="#6b7280" font-size="11">each MCP tool needs</text><text x="460" y="274" text-anchor="middle" fill="#6b7280" font-size="11">a specific capability</text>
</g>
<line x1="542" y1="190" x2="558" y2="190" stroke="#7b8494" stroke-width="2" marker-end="url(#ap)"/>
<g>
<rect x="560" y="48" width="160" height="290" rx="10" fill="#f4f6fa" stroke="#cfd6e0"/>
<text x="640" y="74" text-anchor="middle" font-weight="700" fill="#1f2937">4 · Rows</text>
<text x="640" y="94" text-anchor="middle" fill="#4b5563" font-size="12">Row-level security</text>
<g fill="#1f2937" font-size="12"><text x="640" y="124" text-anchor="middle">USERNAME() filter</text><text x="640" y="146" text-anchor="middle">Entitlement table</text><text x="640" y="168" text-anchor="middle">Virtual Connection</text><text x="640" y="185" text-anchor="middle">data policy</text><text x="640" y="207" text-anchor="middle">User attribute functions</text></g>
<text x="640" y="258" text-anchor="middle" fill="#6b7280" font-size="11">same data source,</text><text x="640" y="274" text-anchor="middle" fill="#6b7280" font-size="11">different rows per user</text>
</g>
<line x1="722" y1="190" x2="738" y2="190" stroke="#7b8494" stroke-width="2" marker-end="url(#ap)"/>
<g>
<rect x="740" y="48" width="150" height="290" rx="10" fill="#e2f5f1" stroke="#0e8574" stroke-width="1.5"/>
<text x="815" y="74" text-anchor="middle" font-weight="700" fill="#0e8574">5 · MCP scope</text>
<text x="815" y="94" text-anchor="middle" fill="#4b5563" font-size="12">Tableau MCP env</text>
<g fill="#1f2937" font-size="11.5" font-family="IBM Plex Mono, monospace"><text x="815" y="124" text-anchor="middle">INCLUDE_TOOLS</text><text x="815" y="146" text-anchor="middle">INCLUDE_PROJECT_IDS</text><text x="815" y="168" text-anchor="middle">INCLUDE_TAGS</text><text x="815" y="190" text-anchor="middle">INCLUDE_DATASOURCE_IDS</text><text x="815" y="212" text-anchor="middle">EXCLUDE_TOOLS</text></g>
<text x="815" y="258" text-anchor="middle" fill="#6b7280" font-size="11">extra fence on top of</text><text x="815" y="274" text-anchor="middle" fill="#6b7280" font-size="11">Tableau — never instead</text>
</g>
</svg>
