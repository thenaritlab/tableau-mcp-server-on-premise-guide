<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="12.5">
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#7b8494"/></marker></defs>
<g>
<rect x="10" y="15" width="280" height="330" rx="10" fill="#f6f8fb" stroke="#dfe4ec"/>
<text x="150" y="42" text-anchor="middle" font-weight="700" font-size="14" fill="#1c2430">A · Personal Access Token</text>
<text x="150" y="62" text-anchor="middle" fill="#7b8494">Testing · single user · stdio</text>
<rect x="30" y="80" width="240" height="46" rx="8" fill="#fff" stroke="#c9d1dc"/><text x="150" y="99" text-anchor="middle">Admin creates PAT in</text><text x="150" y="116" text-anchor="middle">Account Settings</text>
