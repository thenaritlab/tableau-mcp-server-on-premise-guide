<g>
<rect x="310" y="15" width="280" height="330" rx="10" fill="#f6f8fb" stroke="#dfe4ec"/>
<text x="450" y="42" text-anchor="middle" font-weight="700" font-size="14" fill="#1c2430">B · Connected App (Direct Trust)</text>
<text x="450" y="62" text-anchor="middle" fill="#7b8494">Service account · embedding · UBL</text>
<rect x="330" y="80" width="240" height="46" rx="8" fill="#fff" stroke="#c9d1dc"/><text x="450" y="99" text-anchor="middle">Admin creates Connected App</text><text x="450" y="116" text-anchor="middle">→ client ID, secret ID, secret</text>
<line x1="450" y1="126" x2="450" y2="146" stroke="#7b8494" stroke-width="1.5" marker-end="url(#a2)"/>
<rect x="330" y="148" width="240" height="46" rx="8" fill="#fff" stroke="#c9d1dc"/><text x="450" y="167" text-anchor="middle">MCP mints a short-lived JWT</text><text x="450" y="184" text-anchor="middle">sub = JWT_SUB_CLAIM user</text>
<line x1="450" y1="194" x2="450" y2="214" stroke="#7b8494" stroke-width="1.5" marker-end="url(#a2)"/>
<rect x="330" y="216" width="240" height="46" rx="8" fill="#fff" stroke="#c9d1dc"/><text x="450" y="235" text-anchor="middle">REST API trusts the JWT and</text><text x="450" y="252" text-anchor="middle">runs as that user</text>
<text x="450" y="292" text-anchor="middle" fill="#0f7c6b" font-weight="600">No stored user password</text>
<text x="450" y="312" text-anchor="middle" fill="#a86a08">Fixed sub = shared identity</text>
</g>
<g>
<rect x="610" y="15" width="280" height="330" rx="10" fill="#e8f0f9" stroke="#1c5d99" stroke-width="1.5"/>
