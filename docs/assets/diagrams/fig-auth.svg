<rect x="30" y="216" width="240" height="46" rx="8" fill="#fff" stroke="#c9d1dc"/><text x="150" y="235" text-anchor="middle">Every request runs as the</text><text x="150" y="252" text-anchor="middle">PAT owner (one identity)</text>
<text x="150" y="292" text-anchor="middle" fill="#a86a08" font-weight="600">Not concurrent-safe</text>
<text x="150" y="312" text-anchor="middle" fill="#a86a08">Expires after 15 days unused</text>
