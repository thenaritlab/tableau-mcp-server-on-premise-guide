<rect x="630" y="80" width="240" height="46" rx="8" fill="#fff" stroke="#c9d1dc"/><text x="750" y="99" text-anchor="middle">Client connects → MCP replies</text><text x="750" y="116" text-anchor="middle">"authorization required"</text>
