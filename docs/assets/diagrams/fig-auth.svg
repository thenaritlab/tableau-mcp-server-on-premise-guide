<rect x="630" y="148" width="240" height="46" rx="8" fill="#fff" stroke="#c9d1dc"/><text x="750" y="167" text-anchor="middle">User signs in to Tableau site</text><text x="750" y="184" text-anchor="middle">(SAML / AD / local – unchanged)</text>
