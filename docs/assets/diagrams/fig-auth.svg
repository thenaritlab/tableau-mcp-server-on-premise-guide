<rect x="630" y="216" width="240" height="46" rx="8" fill="#fff" stroke="#c9d1dc"/><text x="750" y="235" text-anchor="middle">Embedded auth server issues</text><text x="750" y="252" text-anchor="middle">JWE access + refresh tokens</text>
