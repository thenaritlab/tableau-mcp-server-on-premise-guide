<svg viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, IBM Plex Sans Thai, Segoe UI, sans-serif" font-size="13">
  <defs>
    <clipPath id="win"><rect x="20" y="20" width="1060" height="660" rx="14"/></clipPath>
  </defs>
  <!-- browser window -->
  <rect x="20" y="20" width="1060" height="660" rx="14" fill="#f4f6fa" stroke="#cfd6e0"/>
  <g clip-path="url(#win)">
    <rect x="20" y="20" width="1060" height="44" fill="#e9eef5"/>
    <circle cx="44" cy="42" r="6" fill="#f06a6a"/><circle cx="64" cy="42" r="6" fill="#f5c451"/><circle cx="84" cy="42" r="6" fill="#5fcc7a"/>
    <rect x="110" y="30" width="700" height="24" rx="12" fill="#fff" stroke="#dfe4ec"/>
    <text x="126" y="47" fill="#6b7280" font-size="12.5">🔒  https://analytics.demo-company.local</text>
    <!-- app header -->
    <rect x="20" y="64" width="1060" height="52" fill="#fff"/>
    <line x1="20" y1="116" x2="1080" y2="116" stroke="#e3e8ef"/>
    <rect x="40" y="78" width="26" height="26" rx="7" fill="#2563a8"/>
    <text x="78" y="96" font-weight="700" font-size="15" fill="#1f2937">Demo Company Analytics</text>
    <text x="820" y="96" fill="#6b7280">alice · analyst</text>
    <rect x="936" y="78" width="120" height="28" rx="6" fill="#f4f6fa" stroke="#cfd6e0"/>
    <text x="996" y="97" text-anchor="middle" fill="#4b5563" font-weight="600">Sign out</text>

    <!-- chat panel -->
    <rect x="20" y="116" width="600" height="564" fill="#fff"/>
    <line x1="620" y1="116" x2="620" y2="680" stroke="#e3e8ef"/>
    <text x="40" y="142" fill="#6b7280" font-size="12" font-weight="600">💬 ASK YOUR DATA</text>

    <!-- assistant bubble 1 -->
    <rect x="40" y="156" width="430" height="46" rx="14" fill="#f4f6fa" stroke="#e3e8ef"/>
    <text x="56" y="184" fill="#1f2937">Hi alice. Ask me about sales, inventory, or any published data source.</text>

    <!-- user bubble -->
    <rect x="228" y="216" width="372" height="46" rx="14" fill="#2563a8"/>
    <text x="246" y="244" fill="#fff">Which region had the highest sales last quarter?</text>

    <!-- assistant bubble 2 with table -->
    <rect x="40" y="276" width="500" height="238" rx="14" fill="#f4f6fa" stroke="#e3e8ef"/>
    <text x="56" y="302" fill="#1f2937"><tspan font-weight="600">West</tspan> had the highest sales in Q2 2026 at <tspan font-weight="600">฿4.82M</tspan>, up 11% vs Q1.</text>
    <!-- mini table -->
    <rect x="56" y="316" width="468" height="128" rx="8" fill="#fff" stroke="#dfe4ec"/>
    <rect x="56" y="316" width="468" height="28" rx="8" fill="#e9eef5"/>
    <text x="72" y="335" font-weight="600" fill="#4b5563">Region</text><text x="250" y="335" font-weight="600" fill="#4b5563">Sales (Q2)</text><text x="400" y="335" font-weight="600" fill="#4b5563">vs Q1</text>
    <g fill="#1f2937">
      <text x="72" y="362">West</text><text x="250" y="362">฿4.82M</text><text x="400" y="362" fill="#0e8574">▲ 11%</text>
      <text x="72" y="387">Central</text><text x="250" y="387">฿3.91M</text><text x="400" y="387" fill="#b83a3a">▼ 4%</text>
      <text x="72" y="412">East</text><text x="250" y="412">฿3.40M</text><text x="400" y="412" fill="#0e8574">▲ 6%</text>
      <text x="72" y="437">South</text><text x="250" y="437">฿2.15M</text><text x="400" y="437" fill="#0e8574">▲ 2%</text>
    </g>
    <text x="56" y="468" fill="#4b5563" font-size="12">Source: <tspan font-weight="600">Sales</tspan> data source · filter: Order Date = 2026 Q2 · measure: SUM(Sales)</text>
    <!-- tool chips -->
    <rect x="56" y="482" width="118" height="20" rx="10" fill="#e9f1fb"/><text x="115" y="496" text-anchor="middle" fill="#17457a" font-size="11" font-family="IBM Plex Mono, monospace">list-datasources</text>
    <rect x="180" y="482" width="82" height="20" rx="10" fill="#e9f1fb"/><text x="221" y="496" text-anchor="middle" fill="#17457a" font-size="11" font-family="IBM Plex Mono, monospace">list-fields</text>
    <rect x="268" y="482" width="118" height="20" rx="10" fill="#e9f1fb"/><text x="327" y="496" text-anchor="middle" fill="#17457a" font-size="11" font-family="IBM Plex Mono, monospace">query-datasource</text>

    <!-- user bubble 2 -->
    <rect x="300" y="528" width="300" height="46" rx="14" fill="#2563a8"/>
    <text x="318" y="556" fill="#fff">Why did Central drop? Show sub-categories.</text>
    <!-- typing -->
    <rect x="40" y="588" width="200" height="34" rx="14" fill="#f4f6fa" stroke="#e3e8ef"/>
    <text x="56" y="610" fill="#6b7280" font-style="italic">Looking at the data…</text>

    <!-- composer -->
    <rect x="20" y="632" width="600" height="48" fill="#fff"/>
    <line x1="20" y1="632" x2="620" y2="632" stroke="#e3e8ef"/>
    <rect x="36" y="641" width="470" height="30" rx="8" fill="#fff" stroke="#cfd6e0"/>
    <text x="50" y="661" fill="#9ca3af">Ask a question about your data…</text>
    <rect x="516" y="641" width="88" height="30" rx="8" fill="#2563a8"/>
    <text x="560" y="661" text-anchor="middle" fill="#fff" font-weight="600">Send</text>

    <!-- embedded dashboard panel -->
    <rect x="620" y="116" width="460" height="564" fill="#f8fafc"/>
    <text x="640" y="142" fill="#6b7280" font-size="12" font-weight="600">📊 SALES OVERVIEW  ·  embedded Tableau view</text>
    <rect x="640" y="154" width="420" height="500" rx="10" fill="#fff" stroke="#e3e8ef"/>
    <!-- KPI tiles -->
    <g>
      <rect x="656" y="170" width="126" height="64" rx="8" fill="#f4f6fa"/><text x="668" y="190" fill="#6b7280" font-size="11">Sales Q2</text><text x="668" y="220" font-weight="700" font-size="20" fill="#1f2937">฿14.3M</text>
      <rect x="788" y="170" width="126" height="64" rx="8" fill="#f4f6fa"/><text x="800" y="190" fill="#6b7280" font-size="11">Profit</text><text x="800" y="220" font-weight="700" font-size="20" fill="#1f2937">฿1.9M</text>
      <rect x="920" y="170" width="124" height="64" rx="8" fill="#f4f6fa"/><text x="932" y="190" fill="#6b7280" font-size="11">Margin</text><text x="932" y="220" font-weight="700" font-size="20" fill="#b83a3a">13.2%</text>
    </g>
    <!-- bar chart by region -->
    <text x="656" y="262" fill="#4b5563" font-weight="600" font-size="12">Sales by region</text>
    <g>
      <text x="656" y="290" fill="#6b7280" font-size="12">West</text><rect x="716" y="278" width="300" height="16" rx="3" fill="#2563a8"/><text x="1022" y="291" fill="#1f2937" font-size="12">4.82</text>
      <text x="656" y="318" fill="#6b7280" font-size="12">Central</text><rect x="716" y="306" width="243" height="16" rx="3" fill="#7fa7d6"/><text x="965" y="319" fill="#1f2937" font-size="12">3.91</text>
      <text x="656" y="346" fill="#6b7280" font-size="12">East</text><rect x="716" y="334" width="212" height="16" rx="3" fill="#7fa7d6"/><text x="934" y="347" fill="#1f2937" font-size="12">3.40</text>
      <text x="656" y="374" fill="#6b7280" font-size="12">South</text><rect x="716" y="362" width="134" height="16" rx="3" fill="#7fa7d6"/><text x="856" y="375" fill="#1f2937" font-size="12">2.15</text>
    </g>
    <!-- line chart trend -->
    <text x="656" y="412" fill="#4b5563" font-weight="600" font-size="12">Monthly trend</text>
    <polyline points="660,530 700,515 740,522 780,498 820,505 860,480 900,488 940,462 980,470 1020,440" fill="none" stroke="#0e8574" stroke-width="2.5"/>
    <polyline points="660,545 700,540 740,548 780,536 820,542 860,530 900,538 940,528 980,533 1020,520" fill="none" stroke="#cfd6e0" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="656" y1="560" x2="1044" y2="560" stroke="#e3e8ef"/>
    <text x="656" y="578" fill="#9ca3af" font-size="11">Jan</text><text x="1010" y="578" fill="#9ca3af" font-size="11">Sep</text>
    <text x="656" y="606" fill="#0e8574" font-size="11">— 2026</text><text x="716" y="606" fill="#9ca3af" font-size="11">- - 2025</text>
    <text x="656" y="638" fill="#9ca3af" font-size="11">Signed in silently via Connected App JWT · RLS applied for alice</text>
  </g>
</svg>
