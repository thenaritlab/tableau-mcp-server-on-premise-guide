<svg viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, IBM Plex Sans Thai, Segoe UI, sans-serif" font-size="13">
  <!-- sign-in -->
  <rect x="20" y="20" width="520" height="380" rx="14" fill="#f4f6fa" stroke="#cfd6e0"/>
  <text x="40" y="48" fill="#6b7280" font-size="12" font-weight="600">1 · SIGN IN (portal handles identity — Tableau credentials never reach the browser)</text>
  <rect x="150" y="76" width="260" height="290" rx="12" fill="#fff" stroke="#e3e8ef"/>
  <rect x="172" y="98" width="28" height="28" rx="7" fill="#2563a8"/>
  <text x="210" y="118" font-weight="700" font-size="15" fill="#1f2937">Demo Company Analytics</text>
  <rect x="172" y="150" width="216" height="36" rx="7" fill="#fff" stroke="#cfd6e0"/><text x="186" y="173" fill="#1f2937">alice</text>
  <rect x="172" y="196" width="216" height="36" rx="7" fill="#fff" stroke="#cfd6e0"/><text x="186" y="219" fill="#1f2937">••••••••••</text>
  <rect x="172" y="252" width="216" height="38" rx="7" fill="#2563a8"/><text x="280" y="276" text-anchor="middle" fill="#fff" font-weight="600">Sign in</text>
  <text x="280" y="322" text-anchor="middle" fill="#9ca3af" font-size="11">or continue with company SSO</text>
  <rect x="172" y="330" width="216" height="24" rx="6" fill="#f4f6fa" stroke="#e3e8ef"/><text x="280" y="346" text-anchor="middle" fill="#4b5563" font-size="11">SAML / OIDC (production)</text>

  <!-- what happens behind -->
  <rect x="560" y="20" width="520" height="380" rx="14" fill="#f4f6fa" stroke="#cfd6e0"/>
  <text x="580" y="48" fill="#6b7280" font-size="12" font-weight="600">2 · WHAT ONE CHAT TURN DOES BEHIND THE MASK</text>
  <g font-size="12.5">
    <rect x="580" y="66" width="480" height="40" rx="8" fill="#fff" stroke="#e3e8ef"/>
    <text x="596" y="83" fill="#1f2937" font-weight="600">① Browser → POST /api/chat</text><text x="596" y="99" fill="#6b7280">{ messages: [...] } + session cookie</text>
    <rect x="580" y="114" width="480" height="40" rx="8" fill="#fff" stroke="#e3e8ef"/>
    <text x="596" y="131" fill="#1f2937" font-weight="600">② Portal → Tableau MCP  listTools()</text><text x="596" y="147" fill="#6b7280">gets the tool catalogue: list-datasources, query-datasource, …</text>
    <rect x="580" y="162" width="480" height="40" rx="8" fill="#fff" stroke="#e3e8ef"/>
    <text x="596" y="179" fill="#1f2937" font-weight="600">③ Portal → LLM  (question + tools + user context)</text><text x="596" y="195" fill="#6b7280">model decides: call query-datasource with Region, SUM(Sales), Q2 filter</text>
    <rect x="580" y="210" width="480" height="40" rx="8" fill="#fff" stroke="#e3e8ef"/>
    <text x="596" y="227" fill="#1f2937" font-weight="600">④ Portal → Tableau MCP  callTool()  → Tableau Server REST / VDS</text><text x="596" y="243" fill="#6b7280">permissions + row-level security applied by Tableau</text>
    <rect x="580" y="258" width="480" height="40" rx="8" fill="#fff" stroke="#e3e8ef"/>
    <text x="596" y="275" fill="#1f2937" font-weight="600">⑤ Portal → LLM  (tool result)  → final answer</text><text x="596" y="291" fill="#6b7280">loop repeats up to 8 rounds if the model needs more data</text>
    <rect x="580" y="306" width="480" height="40" rx="8" fill="#fff" stroke="#e3e8ef"/>
    <text x="596" y="323" fill="#1f2937" font-weight="600">⑥ audit.jsonl ← who · question · tools · latency</text><text x="596" y="339" fill="#6b7280">reply JSON goes back to the browser; no URL, token or LUID inside</text>
  </g>
  <text x="580" y="384" fill="#9ca3af" font-size="11">Secrets live only in the portal's .env · MCP port 3927 bound to localhost · LLM sees tool results, never the database</text>
</svg>
